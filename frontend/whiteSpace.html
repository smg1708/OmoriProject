<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Space</title>
    <link rel="stylesheet" href="/frontend/style/whiteSpace.css">
</head>

<body>
    <div id="whitePage">
        <div class="container-inicio">
            <div class="itemClique porta" onclick="porta()"></div>
            <div class="itemClique notebook" onclick="notebook()"></div>
            <div class="itemClique lampada" onclick="lampada()"></div>
            <div class="itemClique gato" onclick="gato()"></div>
            <div class="itemClique caderno" onclick="caderno()"></div>
            <div class="itemClique lenco" onclick="lenco()"></div>
        </div>
        <div class="container-dialogo" id="containerDialogo">
            <div class="box-dialogo" id="boxDialogo" style="display: none;">
            </div>
        </div>
    </div>
    <div id="telaCorte" aria-hidden="true">
    </div>
</body>
</html>

<script>

    function porta() {
        const box = document.getElementById("boxDialogo");
        box.innerHTML = `
            <div class="box-escolhas">
                <button onclick="abrirPorta()">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="">
                    <span>Abrir a porta?</span>
                </button>
                <button onclick="passarDialogo()">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="">
                    <span>Não fazer nada</span>
                </button>
            </div>
            <div class="box-comentario">
                <div class="box-texto">
                    <p>Uma porta branca projeta uma sombra tênue.<br>O que você gostaria de fazer?</p>
                </div>
            </div>
        `;

        box.style.display = "flex";
    }

    function notebook() {
        const box = document.getElementById("boxDialogo");
        box.innerHTML = `
            <div class="box-nome">
                <p>Laptop</p>
            </div>
            <div class="box-comentario" onclick="notev2()">
                <div class="box-texto">
                    <p>Você ligou seu laptop. O calor do laptop aqueceu seu colo. Foi uma sensação agradável</p>
                </div>
                <div class="box-imagem">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="Passar diálogo">
                </div>
            </div>
        `;

        box.style.display = "flex";
    }

    function notev2() {
        const box = document.getElementById("boxDialogo");
        box.innerHTML = `
            <div class="container-nome-escolha">
                <div class="box-nome">
                    <p>Laptop</p>
                </div>
                <div class="box-escolhas">
                    <button onclick="entrarNote()">
                        <img src="/frontend/assets/todos/passarDialogo.png" alt="">
                        <span>Acessar laptop</span>
                    </button>
                    <button onclick="passarDialogo()">
                        <img src="/frontend/assets/todos/passarDialogo.png" alt="">
                        <span>Desligar</span>
                    </button>
                </div>
            </div>
            <div class="box-comentario">
                <div class="box-texto">
                    <p>Você esta encarando a tela, o que você quer fazer?</p>
                </div>
                <div class="box-imagem">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="Passar diálogo">
                </div>
            </div>
        `;

        box.style.display = "flex"; 
    }

    function entrarNote() {
        window.location.href = "login.html";
    }

    function lampada() {
        const box = document.getElementById("boxDialogo");
        box.innerHTML = `
            <div class="box-nome">
                <p>Lâmpada</p>
            </div>
            <div class="box-comentario" onclick="passarDialogo()">
                <div class="box-texto">
                    <p>Uma lâmpada está pendurada no teto, seja lá onde for.<br>Está completamente escuro lá dentro. Você não consegue ver nada.</p>
                </div>
                <div class="box-imagem">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="Passar diálogo">
                </div>
            </div>
        `;

        box.style.display = "flex";
    }

    function caderno() {
        const box = document.getElementById("boxDialogo");
        box.innerHTML = `
            <div class="box-nome">
                <p>Caderno de Desenhos</p>
            </div>
            <div class="box-comentario" onclick="passarDialogo()">
                <div class="box-texto">
                    <p>Seu caderno de desenhos.</p>
                </div>
                <div class="box-imagem">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="Passar diálogo">
                </div>
            </div>
        `;

        box.style.display = "flex";
    }

    function gato() {
        const box = document.getElementById("boxDialogo");
        box.innerHTML = `
            <div class="box-nome">
                <p>Mewo</p>
            </div>
            <div class="box-comentario" onclick="passarDialogo()">
                <div class="box-texto">
                    <p>Meow? (Esperando alguma coisa acontecer?)</p>
                </div>
                <div class="box-imagem">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="Passar diálogo">
                </div>
            </div>
        `;

        box.style.display = "flex";
    }

    function lenco() {
        const box = document.getElementById("boxDialogo");
        box.innerHTML = `
            <div class="box-nome">
                <p>Caixa de Lenços</p>
            </div>
            <div class="box-comentario" onclick="passarDialogo()">
                <div class="box-texto">
                    <p>Uma caixa de lenços para enxugar suas mágoas..</p>
                </div>
                <div class="box-imagem">
                    <img src="/frontend/assets/todos/passarDialogo.png" alt="Passar diálogo">
                </div>
            </div>
        `;
        
        box.style.display = "flex";
    }

    function passarDialogo() {
        const box = document.getElementById("boxDialogo");
        box.style.display = "none";
        box.innerHTML = "";
    }

    function abrirPorta() {
        const box = document.getElementById("boxDialogo");
        const tela = document.getElementById("telaCorte");
        const pagina = document.getElementById("whitePage");

        box.innerHTML = `
            <div class="box-nome">
                <p>A Porta</p>
            </div>

            <div class="box-comentario">
                <div class="box-texto">
                    <p>Você abriu a porta...</p>
                </div>
            </div>
        `;

        document.documentElement.style.overflow = "hidden";
        tela.classList.add("ativo");

        setTimeout(() => {
            pagina.hidden = true;

            tela.classList.add("piscando");

            setTimeout(() => {
                window.location.href = "mundoSonhos.html";
            }, 1200);

        }, 1000);
    }

</script>
